# One-command spin-up:  docker compose up -d --build
# Then point Godot clients at  ws://<this-host-ip>:4000/ws  (127.0.0.1 if on the same machine).
services:
  db:
    image: postgres:16-alpine
    container_name: gates-of-elyra-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gates_of_elyra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  relay:
    build: .
    image: gates-of-elyra-relay:latest
    container_name: gates-of-elyra-relay
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      # Host `db` is the compose service name (Docker's internal DNS). The relay runs migrations on
      # boot (see the Dockerfile CMD), then serves.
      DATABASE_URL: "ecto://postgres:postgres@db/gates_of_elyra"
      # Phoenix endpoint signing key. REQUIRED in prod — generate your own and replace this:
      #   docker run --rm gates-of-elyra-relay:latest bin/server eval "IO.puts(:crypto.strong_rand_bytes(48) |> Base.encode64())"
      # (or `mix phx.gen.secret` in a dev checkout). It only needs to be a long, stable secret.
      SECRET_KEY_BASE: "REPLACE_ME_with_a_64_byte_secret_generated_as_described_above_xxxxxxxx"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
